<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lexi</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Icons" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: "Manrope", -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f4ede1;
        color: #2b2822;
      }
      .material-icons {
        font-family: "Material Icons";
        font-weight: normal;
        font-style: normal;
        display: inline-block;
        line-height: 1;
        -webkit-font-smoothing: antialiased;
      }
      button { font: inherit; color: inherit; }

      #app, .panel { display: flex; flex-direction: column; height: 100vh; }

      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 20px 18px 16px;
        border-bottom: 1px dashed #e2b4ad;
        flex-shrink: 0;
      }
      .stamp {
        position: relative;
        width: 46px;
        height: 46px;
        flex-shrink: 0;
        border-radius: 50%;
        border: 2px solid #a33;
        opacity: 0.85;
        transform: rotate(-9deg) scale(1.04, 0.96);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stamp::before {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: 50%;
        border: 1px dashed #a33;
      }
      .stamp .material-icons { color: #a33; font-size: 18px; }
      .who { flex-grow: 1; min-width: 0; }
      .name { font-family: "Cormorant Garamond", Georgia, serif; font-size: 21px; font-weight: 700; }
      .label {
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 9px;
        letter-spacing: 0.08em;
        color: #8a7f63;
        text-transform: uppercase;
      }
      .label.section { margin: 16px 18px 8px; }
      .who .label { margin-top: 3px; }

      .iconBtn {
        flex-shrink: 0;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        border: 1px solid #ddd0ae;
        background: transparent;
        color: #6b6350;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .list { flex-grow: 1; overflow-y: auto; padding: 0 18px; }
      .row { border-bottom: 1px dashed #e2b4ad; padding: 11px 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .row .word { font-family: "Cormorant Garamond", Georgia, serif; font-size: 18px; font-weight: 700; }
      .row .meaning { color: #6b6350; font-size: 12px; }
      .row .del { font-size: 15px; color: #9c9174; cursor: pointer; flex-shrink: 0; background: none; border: none; padding: 0; }
      .empty { color: #6b6350; font-size: 13px; padding: 12px 0; }

      .footer { padding: 14px 18px 18px; border-top: 1px dashed #e2b4ad; display: flex; gap: 8px; flex-shrink: 0; }
      .pillBtn {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        font-size: 12px;
        font-weight: 600;
        color: #6b6350;
        background: #f4ede1;
        border: 1px solid #ddd0ae;
        padding: 9px 10px;
        border-radius: 10px;
        cursor: pointer;
      }
      .pillBtn .material-icons { font-size: 14px; }

      .subHeader { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; border-bottom: 1px dashed #e2b4ad; flex-shrink: 0; }
      .subHeader .title { font-family: "Cormorant Garamond", Georgia, serif; font-size: 19px; font-weight: 700; }
      .subHeader .iconBtn.back { border: none; width: auto; height: auto; padding: 0; background: none; }

      .body { flex-grow: 1; overflow-y: auto; padding: 16px 18px 18px; }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 9px 12px;
        font-size: 13px;
        font-family: "Manrope", sans-serif;
        border: 1px solid #e4d9bd;
        border-radius: 8px;
        background: #fff;
        color: #2b2822;
        margin-bottom: 8px;
      }

      .primaryBtn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        background: #8a7f63;
        border: 1px solid #8a7f63;
        padding: 10px 16px;
        border-radius: 10px;
        cursor: pointer;
        margin: 8px 0 20px;
      }
      .err { color: #a33; font-size: 12px; margin-bottom: 8px; }
      .success { color: #5a7d5f; font-size: 12px; font-weight: 600; margin-bottom: 16px; }

      .preview { border-top: 1px dashed #e2b4ad; padding-top: 16px; }
      .preview .pword { font-family: "Cormorant Garamond", Georgia, serif; font-size: 24px; font-weight: 700; margin-bottom: 4px; }
      .preview .ppron { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; color: #7d735a; margin-bottom: 8px; }
      .preview .pmeaning { font-size: 13px; color: #6b6350; margin-bottom: 8px; }
      .preview .pexample { font-size: 13px; font-style: italic; color: #3a362c; line-height: 1.5; }

      .quizCard { text-align: center; padding: 24px 0; }
      .quizCard .word { font-family: "Cormorant Garamond", Georgia, serif; font-size: 24px; font-weight: 700; margin-bottom: 16px; }
      .quizCard .meaning { font-size: 13px; color: #6b6350; margin-bottom: 16px; }
      .quizActions { display: flex; gap: 8px; }
      .quizActions .pillBtn { flex: 1; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="sidepanel.js"></script>
  </body>
</html>
