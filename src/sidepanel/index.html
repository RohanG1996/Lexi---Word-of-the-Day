<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lexi</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Manrope:wght@400;500;600&display=swap"
    />
    <style>
      /* Ruled-paper grid: every row is a multiple of 49px, rules sit on the last pixel of a row,
         and a red margin line runs down the left at x=40. Matches the widget card. */
      :root {
        --paper: #f7f3ea; --border: #d8d3c9; --ink: #171717; --ink-2: #45423e; --ink-body: #242424; --ink-quote: #4a4742;
        --label: #252525; --muted: #66615a; --rule: rgba(110, 155, 215, 0.5); --margin: rgba(214, 100, 96, 0.7);
        --cta: rgba(110, 155, 215, 0.9); --success: #4f7053; --error: #a33333;
        --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        --sans: "Manrope", -apple-system, "Segoe UI", Roboto, sans-serif;
        --grid: 49px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { font-family: var(--sans); background: var(--paper); color: var(--ink); }
      [hidden] { display: none !important; }
      button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
      button:focus-visible, input:focus-visible { outline: 1.5px solid #77736c; outline-offset: 2px; }
      svg { display: block; }

      #app, .panel { display: flex; flex-direction: column; height: 100vh; }
      .panel { position: relative; overflow: hidden; }
      .panel::after { content: ""; position: absolute; top: 0; bottom: 0; left: 40px; width: 1.5px; background: var(--margin); pointer-events: none; }

      /* headers: 98px = two grid rows, rule on the last pixel */
      .header, .subHeader {
        flex: none; height: calc(var(--grid) * 2); display: flex; align-items: center; padding: 0 22px 0 58px;
        border-bottom: 1px solid var(--rule);
      }
      .header { justify-content: space-between; gap: 12px; }
      .who { min-width: 0; }
      .name { font-family: var(--serif); font-size: 34px; line-height: 36px; font-weight: 500; }
      .label {
        font-family: var(--sans); font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
      }
      .who .label { margin-top: 4px; }
      .subHeader { gap: 14px; }
      .subHeader .title { font-family: var(--serif); font-size: 30px; line-height: 34px; font-weight: 500; }
      .subHeader .label { margin-left: auto; }
      .subHeader .iconBtn.back { width: auto; height: auto; border: none; border-radius: 0; color: var(--label); }
      .subHeader .iconBtn.back svg { width: 22px; height: 22px; }

      .iconBtn {
        flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--cta); background: var(--paper);
        display: flex; align-items: center; justify-content: center; color: var(--ink);
      }
      .iconBtn svg { width: 20px; height: 20px; }

      /* scrolling area carries the rules; local attachment keeps them locked to the rows */
      .list, .body {
        flex: 1; overflow-y: auto;
        background: linear-gradient(to bottom, transparent calc(var(--grid) - 1px), var(--rule) calc(var(--grid) - 1px)) 0 0 / 100% var(--grid) local;
      }
      .body .list { flex: none; overflow: visible; background: none; padding: 0; }
      .label.section { height: var(--grid); display: flex; align-items: center; margin: 0; padding: 0 22px 0 58px; }

      .row { height: var(--grid); padding: 0 22px 1px 58px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .row > div { min-width: 0; }
      .row .word { font-family: var(--serif); font-size: 24px; line-height: 26px; font-weight: 500; }
      .row .meaning { font-size: 13px; line-height: 15px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row .del { flex: none; display: flex; color: var(--muted); }
      .row .del svg { width: 18px; height: 18px; }
      .empty { height: var(--grid); padding: 0 22px 0 58px; display: flex; align-items: center; font-size: 14px; color: var(--muted); }

      .footer { flex: none; height: calc(var(--grid) * 2); padding: 0 22px 0 58px; display: flex; align-items: center; gap: 12px; background: var(--paper); }
      .pillBtn {
        flex: 1; height: 52px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 400;
        color: var(--ink); background: var(--paper); border: 1.5px solid var(--cta); border-radius: 12px; padding: 0 20px;
      }
      .pillBtn:hover, .primaryBtn:hover, .iconBtn:hover { background: #f1ebdd; }
      .pillBtn svg { width: 20px; height: 20px; }

      input {
        display: block; width: calc(100% - 80px); height: 43px; margin: 3px 22px 3px 58px; padding: 0 16px; font-family: var(--sans); font-size: 15px;
        border: 1.5px solid var(--cta); border-radius: 10px; background: #fff; color: var(--ink);
      }
      input::placeholder { color: var(--muted); }
      input.tall { margin: 24px 22px 31px 58px; }

      .primaryBtn {
        width: calc(100% - 80px); height: 56px; margin: 21px 22px 21px 58px; display: flex; align-items: center; justify-content: center; gap: 12px;
        font-size: 17px; font-weight: 400; color: var(--ink); background: var(--paper); border: 1.5px solid var(--cta); border-radius: 12px;
      }
      .primaryBtn svg { width: 21px; height: 21px; }
      .err, .success { min-height: var(--grid); display: flex; align-items: center; padding: 0 22px 0 58px; font-size: 13px; }
      .err { color: var(--error); }
      .err:empty { display: none; }
      .success { color: var(--success); font-weight: 600; }

      .preview .pword { height: var(--grid); display: flex; align-items: center; padding: 0 22px 0 58px; font-family: var(--serif); font-size: 38px; font-weight: 500; }
      .preview .ppron { height: var(--grid); display: flex; align-items: center; padding: 0 22px 0 58px; font-family: var(--serif); font-size: 18px; letter-spacing: 0.05em; color: var(--ink-2); }
      .preview .pmeaning { min-height: calc(var(--grid) * 2); display: flex; align-items: center; padding: 0 22px 0 58px; font-family: var(--serif); font-size: 22px; line-height: 30px; font-weight: 500; letter-spacing: 0.02em; color: var(--ink-body); }
      .preview .pexample { min-height: calc(var(--grid) * 2); display: flex; align-items: center; padding: 0 22px 0 58px; font-family: var(--serif); font-size: 19px; line-height: 28px; font-style: italic; font-weight: 500; letter-spacing: 0.03em; color: var(--ink-quote); }

      .quizCard { text-align: center; padding-top: calc(var(--grid) * 3); }
      .quizCard .prompt { justify-content: center; }
      .quizCard .word { height: calc(var(--grid) * 2); display: flex; align-items: center; justify-content: center; padding: 0 22px 0 58px; font-family: var(--serif); font-size: 52px; line-height: 56px; letter-spacing: -0.01em; font-weight: 500; }
      .quizCard .revealBtn { flex: none; width: 240px; margin: 23px auto 23px calc(58px + (100% - 80px - 240px) / 2); }
      .quizCard .meaning { min-height: calc(var(--grid) * 2); display: flex; align-items: center; justify-content: center; padding: 0 22px 0 58px; font-family: var(--serif); font-size: 24px; line-height: 32px; font-weight: 500; letter-spacing: 0.02em; color: var(--ink-body); }
      .quizActions { height: calc(var(--grid) * 2); display: flex; align-items: center; gap: 12px; padding: 0 22px 0 58px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="sidepanel.js"></script>
  </body>
</html>
