<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lexi</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Manrope:wght@400;500;600&display=swap"
    />
    <style>
      /* Side panel, final design: ivory paper, soft blue horizontal lines (same as the widget card), solid darker-ivory
         buttons with no outline, and accordion words with a boxed example. No margin line, no ruled background. */
      :root {
        --paper: #f7f3ea; --border: #d8d3c9; --ink: #171717; --ink-2: #45423e; --ink-body: #242424; --ink-quote: #4a4742;
        --label: #252525; --muted: #66615a; --rule: rgba(110, 155, 215, 0.3); --btn: #ede6d4; --btn-hover: #e6dec9;
        --cta: rgba(110, 155, 215, 0.9); --success: #4f7053; --error: #a33333;
        --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        --sans: "Manrope", -apple-system, "Segoe UI", Roboto, sans-serif;
        --pad: 18px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { font-family: var(--sans); background: var(--paper); color: var(--ink); }
      [hidden] { display: none !important; }
      button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
      button:focus-visible, input:focus-visible { outline: 1.5px solid #77736c; outline-offset: 2px; }
      svg { display: block; }

      #app, .panel { display: flex; flex-direction: column; height: 100vh; }

      .header, .subHeader { flex: none; height: 84px; display: flex; align-items: center; padding: 0 var(--pad); border-bottom: 1px solid var(--rule); }
      .header { justify-content: space-between; gap: 12px; }
      .who { min-width: 0; }
      .name { font-family: var(--serif); font-size: 28px; line-height: 30px; font-weight: 500; }
      .label { font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
      .who .label { margin-top: 4px; }
      .headBtns { display: flex; gap: 8px; flex: none; }
      .subHeader { gap: 12px; }
      .subHeader .title { font-family: var(--serif); font-size: 26px; line-height: 30px; font-weight: 500; }
      .subHeader .label { margin-left: auto; }

      /* solid buttons: darker shade of the panel background, no outline */
      .iconBtn {
        flex: none; width: 40px; height: 40px; border-radius: 10px; background: var(--btn); color: var(--ink);
        display: flex; align-items: center; justify-content: center;
      }
      .iconBtn svg { width: 18px; height: 18px; }
      .iconBtn.back { width: auto; height: auto; background: none; border-radius: 0; color: var(--label); }
      .iconBtn.back svg { width: 20px; height: 20px; }
      .iconBtn:hover, .pillBtn:hover, .primaryBtn:hover { background: var(--btn-hover); }
      .iconBtn.back:hover { background: none; opacity: 0.6; }

      .list, .body { flex: 1; overflow-y: auto; }
      .body .list { flex: none; overflow: visible; }
      .label.section { padding: 16px var(--pad) 8px; margin: 0; }

      /* accordion word rows: one click opens the word; the open row keeps the panel's own background */
      .row { border-bottom: 1px solid var(--rule); }
      .rowHead { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px var(--pad); text-align: left; }
      .rowText { min-width: 0; flex: 1; }
      .row .word { font-family: var(--serif); font-size: 20px; line-height: 24px; font-weight: 500; }
      .row .meaning { margin-top: 1px; font-size: 12px; line-height: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row.open .meaning { display: none; }
      .chev { flex: none; color: var(--muted); transition: transform 0.2s ease; }
      .chev svg { width: 16px; height: 16px; }
      .row.open .chev { transform: rotate(180deg); }
      .rowBody { padding: 0 var(--pad) 14px; }
      .rowBody .pron { font-family: var(--serif); font-size: 15px; letter-spacing: 0.05em; color: var(--ink-2); }
      .rowBody .pron i { margin-left: 10px; }
      .rowBody .full { margin-top: 8px; font-family: var(--serif); font-size: 16px; line-height: 22px; font-weight: 500; letter-spacing: 0.01em; color: var(--ink-body); }
      /* the example sits in a box (darker shade of the background) with its title inside */
      .rowBody .exBox { margin-top: 20px; padding: 10px 14px 12px; background: var(--btn); border-radius: 8px; }
      .rowBody .exLabel { font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
      .rowBody .ex { margin-top: 6px; font-family: var(--serif); font-size: 15px; line-height: 22px; font-style: italic; font-weight: 500; letter-spacing: 0.02em; color: var(--ink-quote); }
      .empty { color: var(--muted); font-size: 13px; padding: 12px var(--pad); }

      .footer { flex: none; height: 84px; padding: 0 var(--pad); border-top: 1px solid var(--rule); display: flex; align-items: center; gap: 12px; }
      .pillBtn {
        flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; white-space: nowrap;
        font-size: 14px; font-weight: 500; color: #2b2822; background: var(--btn); border-radius: 10px;
      }
      .pillBtn svg { width: 18px; height: 18px; }

      input {
        display: block; width: calc(100% - var(--pad) * 2); height: 42px; margin: 8px var(--pad) 0; padding: 0 14px; font-family: var(--sans); font-size: 14px;
        border: 1.5px solid var(--cta); border-radius: 10px; background: #fff; color: var(--ink);
      }
      input::placeholder { color: var(--muted); }
      input.tall { margin: 18px var(--pad) 4px; }

      .primaryBtn {
        width: calc(100% - var(--pad) * 2); height: 46px; margin: 14px var(--pad) 8px; display: flex; align-items: center; justify-content: center; gap: 10px;
        font-size: 15px; font-weight: 500; color: #2b2822; background: var(--btn); border-radius: 10px;
      }
      .primaryBtn svg { width: 19px; height: 19px; }
      .err, .success { margin: 4px var(--pad) 8px; font-size: 12px; }
      .err { color: var(--error); }
      .err:empty { display: none; }
      .success { color: var(--success); font-weight: 600; }

      .preview { margin: 14px var(--pad) 0; padding-top: 6px; border-top: 1px solid var(--rule); }
      .preview .label.section { padding: 12px 0 6px; }
      .preview .pword { font-family: var(--serif); font-size: 32px; line-height: 36px; font-weight: 500; }
      .preview .ppron { margin-top: 4px; font-family: var(--serif); font-size: 16px; letter-spacing: 0.05em; color: var(--ink-2); }
      .preview .pmeaning { margin-top: 12px; font-family: var(--serif); font-size: 18px; line-height: 26px; font-weight: 500; letter-spacing: 0.02em; color: var(--ink-body); }
      .preview .pexample { margin-top: 10px; font-family: var(--serif); font-size: 15px; line-height: 22px; font-style: italic; font-weight: 500; letter-spacing: 0.03em; color: var(--ink-quote); }

      .quizCard { text-align: center; padding: 56px var(--pad) 24px; }
      .quizCard .prompt { padding: 0 0 12px; }
      .quizCard .word { font-family: var(--serif); font-size: 48px; line-height: 52px; letter-spacing: -0.01em; font-weight: 500; margin-bottom: 22px; }
      .quizCard .revealBtn { flex: none; width: 240px; margin: 0 auto; }
      .quizCard .meaning { font-family: var(--serif); font-size: 22px; line-height: 30px; font-weight: 500; letter-spacing: 0.02em; color: var(--ink-body); margin-bottom: 22px; }
      .quizActions { display: flex; gap: 12px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="sidepanel.js"></script>
  </body>
</html>
